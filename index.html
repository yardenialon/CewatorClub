<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; font-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none';">
<title>SimpliiGood Creator Club | Local prototype</title>
<style>
:root {
  --ink: #154048;
  --muted: #687979;
  --sun: #fee62d;
  --paper: #f5f7f3;
  --line: #dde5df;
  --green: #287e63;
  --soft: #eaf2eb;
  --white: #fff;
  --danger: #a34235;
  --shadow: 0 12px 42px rgba(21,64,72,.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.55 Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a,
input,
select,
textarea {
  touch-action: manipulation;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .46;
  cursor: not-allowed;
}

a {
  color: var(--ink);
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #319980;
  outline-offset: 3px;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  font-size: clamp(27px,3vw,39px);
  letter-spacing: -1.1px;
  line-height: 1.2;
  margin-bottom: 12px;
}

h2 {
  font-size: 21px;
  line-height: 1.3;
  margin-bottom: 10px;
}

h3 {
  font-size: 17px;
  line-height: 1.4;
  margin-bottom: 7px;
}

p {
  margin-bottom: 13px;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 12px;
}

.tiny {
  font-size: 11px;
}

.ltr {
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 1.8px;
  font-weight: 700;
  text-transform: uppercase;
  direction: ltr;
  display: block;
  margin-bottom: 13px;
}

.icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  vertical-align: middle;
}

.sidebar {
  width: 235px;
  position: fixed;
  inset-block: 0;
  inset-inline-start: 0;
  background: var(--ink);
  color: white;
  z-index: 20;
  display: flex;
  flex-direction: column;
  padding: 29px 18px;
}

.brandmark {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
  direction: ltr;
  text-align: start;
  display: inline-block;
}

.brandmark span {
  color: var(--sun);
}

.brand-sub {
  font-size: 11px;
  letter-spacing: 2.4px;
  margin: 9px 0 34px;
  direction: ltr;
  opacity: .75;
}

.side-divider {
  height: 1px;
  background: #ffffff20;
  margin-bottom: 19px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  margin: 4px 0;
  width: 100%;
  border: 0;
  background: transparent;
  color: #d6e3df;
  text-align: start;
  border-radius: 11px;
  font-size: 13px;
}

.nav-item:hover {
  background: #ffffff0c;
}

.nav-item.active {
  background: var(--sun);
  color: var(--ink);
  font-weight: 700;
}

.nav-count {
  margin-inline-start: auto;
  min-width: 21px;
  line-height: 20px;
  border-radius: 5px;
  text-align: center;
  font-size: 11px;
  background: #ffffff18;
}

.nav-item.active .nav-count {
  background: #15404812;
}

.side-bottom {
  margin-top: auto;
}

.side-note {
  border: 1px solid #ffffff25;
  border-radius: 13px;
  padding: 15px;
  margin: 16px 0 12px;
  font-size: 12px;
  color: #d6e3df;
}

.side-note .dot {
  background: var(--sun);
}

.side-footer {
  font-size: 10px;
  letter-spacing: .4px;
  color: #94b0af;
  direction: ltr;
  margin-top: 16px;
}

.app-shell {
  margin-inline-start: 235px;
  min-height: 100vh;
}

.topbar {
  padding: 19px 35px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: #ffffffbd;
  min-height: 82px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.mode-switch {
  display: flex;
  gap: 3px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 4px;
}

.mode-switch button {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 12px;
}

.mode-switch button.active {
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 1px 4px #15404816;
  font-weight: 700;
}

.lang-btn {
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  padding: 8px 11px;
  color: var(--ink);
}

.demo-pill,
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  padding: 4px 8px;
  background: var(--soft);
  white-space: nowrap;
}

.demo-pill {
  background: #fff8cc;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: var(--green);
}

.content {
  padding: 25px 35px 40px;
  max-width: 1550px;
  margin: auto;
}

.demo-banner {
  background: #fffbe6;
  border: 1px solid #eee2a5;
  border-radius: 9px;
  padding: 9px 14px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  color: #6e6130;
}

.page-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 7px 0 23px;
}

.page-title p {
  color: var(--muted);
  margin: 0;
}

.page-title h1 {
  font-size: 30px;
}

.btn {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  font-weight: 700;
  background: var(--ink);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  text-decoration: none;
  min-height: 41px;
}

.btn.sun {
  background: var(--sun);
  color: var(--ink);
}

.btn.secondary {
  background: white;
  border: 1px solid var(--line);
  color: var(--ink);
}

.btn.ghost {
  background: transparent;
  color: var(--ink);
  padding: 8px;
}

.btn.danger {
  background: #faeee9;
  color: var(--danger);
}

.btn.sm {
  padding: 7px 10px;
  min-height: 33px;
  font-size: 12px;
}

.btn.wide {
  width: 100%;
}

.hero {
  background: var(--ink);
  color: white;
  border-radius: 19px;
  padding: 30px 32px;
  display: grid;
  grid-template-columns: minmax(0,1fr) 260px;
  position: relative;
  overflow: hidden;
  margin-bottom: 23px;
  min-height: 240px;
  gap: 20px;
}

.hero p {
  color: #d8e7de;
  max-width: 540px;
  font-size: 14px;
}

.hero .eyebrow {
  color: #d4de83;
}

.hero h1 {
  font-size: 37px;
  max-width: 600px;
}

.hero-art {
  position: relative;
  min-height: 168px;
  align-self: center;
  pointer-events: none;
  direction: ltr;
}

.sun-disc {
  height: 150px;
  width: 150px;
  position: absolute;
  left: 58px;
  top: 5px;
  background: var(--sun);
  border-radius: 50%;
}

.cube {
  position: absolute;
  width: 91px;
  height: 91px;
  border-radius: 20px;
  box-shadow: 11px 12px 0 #10343a;
  transform: rotate(-15deg);
  background: #30775f;
  border: 1px solid #4c8e75;
  left: 32px;
  top: 50px;
}

.cube.two {
  background: #62a171;
  border-color: #86b984;
  width: 67px;
  height: 67px;
  left: 125px;
  top: 95px;
  transform: rotate(14deg);
  box-shadow: 7px 9px 0 #10343a;
}

.hero-caption {
  position: absolute;
  left: 28px;
  top: 184px;
  letter-spacing: 1.1px;
  font-size: 10px;
  color: #c4d6cd;
}

.hero-tag {
  position: absolute;
  right: 0;
  top: 16px;
  font-size: 10px;
  padding: 7px 10px;
  background: #ffffff17;
  border: 1px solid #ffffff25;
  border-radius: 8px;
  transform: rotate(8deg);
}

.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.hero .btn.secondary {
  background: #ffffff0c;
  border-color: #ffffff40;
  color: white;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 15px;
  margin-bottom: 23px;
}

.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 21px;
}

.kpi-label {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}

.kpi-value {
  font-size: 33px;
  line-height: 1.15;
  letter-spacing: -1px;
  font-weight: 700;
}

.kpi-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 9px;
}

.kpi-currency {
  font-size: 21px;
  line-height: 1.6;
  font-weight: 700;
  letter-spacing: -.4px;
}

.split {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 20px;
  margin-bottom: 23px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.section-head h2 {
  margin: 0;
}

.section-head p {
  margin: 4px 0 0;
  font-size: 12px;
}

.action-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-top: 1px solid #edf1ed;
  font-size: 13px;
}

.action-row:first-of-type {
  border-top: 0;
}

.row-start {
  display: flex;
  gap: 11px;
  align-items: center;
}

.action-icon {
  background: var(--soft);
  width: 33px;
  height: 33px;
  border-radius: 9px;
  display: grid;
  place-items: center;
}

.action-row strong {
  font-size: 18px;
}

.journey {
  display: grid;
  grid-template-columns: repeat(6,1fr);
  gap: 6px;
  margin-top: 20px;
}

.journey-step {
  text-align: center;
  position: relative;
  font-size: 11px;
}

.journey-step:after {
  content: '';
  position: absolute;
  top: 18px;
  inset-inline-start: 60%;
  width: 80%;
  height: 1px;
  background: var(--line);
}

.journey-step:last-child:after {
  display: none;
}

.step-number {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--soft);
  border-radius: 50%;
  font-weight: 700;
  margin: 0 auto 11px;
  position: relative;
  z-index: 1;
}

.journey-step:first-child .step-number,
.journey-step:last-child .step-number {
  background: var(--sun);
}

.mission-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 17px;
}

.mission-card {
  padding: 0;
  overflow: hidden;
}

.mission-top {
  height: 83px;
  background: var(--soft);
  padding: 17px 21px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.mission-top.yellow {
  background: #fff6ad;
}

.mission-art {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border: 1px solid #15404825;
  border-radius: 13px;
  background: #ffffff55;
}

.mission-art .icon {
  width: 26px;
  height: 26px;
}

.mission-body {
  padding: 20px 21px;
}

.mission-body h3 {
  font-size: 19px;
  margin-bottom: 5px;
}

.mission-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 12px 0 17px;
}

.pill.outline {
  background: transparent;
  border: 1px solid var(--line);
  font-weight: 400;
}

.mission-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}

.progress {
  height: 5px;
  background: var(--soft);
  border-radius: 5px;
  margin: 9px 0 13px;
  overflow: hidden;
}

.progress>span {
  height: 100%;
  display: block;
  background: var(--green);
  border-radius: 5px;
}

.mission-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  gap: 10px;
}

.section-spacer {
  margin-top: 27px;
}

.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.filter-tabs {
  display: flex;
  gap: 4px;
  background: #e8eee8;
  padding: 4px;
  border-radius: 9px;
}

.filter-tabs button {
  padding: 7px 14px;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  font-size: 12px;
}

.filter-tabs .active {
  background: white;
  color: var(--ink);
  box-shadow: 0 1px 3px #15404810;
  font-weight: 700;
}

.search {
  flex: 1;
  min-width: 180px;
  max-width: 330px;
}

.input,
input:not([type=checkbox]):not([type=file]),
select,
textarea {
  border: 1px solid #cfdad2;
  border-radius: 8px;
  background: white;
  color: var(--ink);
  padding: 10px 12px;
  width: 100%;
  min-height: 43px;
}

textarea {
  resize: vertical;
  min-height: 105px;
}

select {
  cursor: pointer;
}

.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: start;
  white-space: nowrap;
}

th {
  font-weight: 400;
  background: #f9fbf7;
  color: var(--muted);
  font-size: 11px;
  padding: 14px 17px;
  border-bottom: 1px solid var(--line);
}

td {
  padding: 17px;
  font-size: 13px;
  border-bottom: 1px solid #ecf0eb;
}

tr:last-child td {
  border-bottom: 0;
}

.creator-cell {
  display: flex;
  gap: 11px;
  align-items: center;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  background: #e5efe4;
  flex-shrink: 0;
  direction: ltr;
}

.avatar.gold {
  background: #fff2af;
}

.avatar.large {
  width: 59px;
  height: 59px;
  border-radius: 18px;
  font-size: 18px;
}

.name-btn {
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 0;
  text-align: start;
  font-weight: 700;
  font-size: 13px;
}

.status {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 10px;
  background: #edf2ed;
  color: #50685a;
  white-space: nowrap;
}

.status.submitted,
.status.pending,
.status.offered {
  background: #fff4ce;
  color: #826a18;
}

.status.changes {
  background: #fff0e7;
  color: #925b33;
}

.status.published,
.status.payable {
  background: #e9f2f8;
  color: #356985;
}

.status.approved,
.status.paid,
.status.active {
  background: #e5f2e8;
  color: #2f7254;
}

.status.cancelled {
  background: #f0eded;
  color: #777;
}

.empty {
  text-align: center;
  padding: 48px 25px;
  color: var(--muted);
  font-size: 14px;
}

.mini-info {
  border-radius: 10px;
  padding: 12px 14px;
  background: #f2f6f0;
  font-size: 12px;
  margin-top: 15px;
}

.mini-info.warning {
  background: #fff9df;
  border: 1px solid #eee5b7;
  color: #7a6638;
}

.mini-info.danger {
  background: #fcf0eb;
  color: #8d4b39;
}

.log-row {
  display: flex;
  gap: 11px;
  padding: 12px 0;
  border-bottom: 1px solid #eef2ed;
  font-size: 12px;
  align-items: center;
}

.log-time {
  margin-inline-start: auto;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.log-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.footer {
  font-size: 10px;
  color: #8b9b91;
  margin-top: 30px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #092c37a1;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(3px);
}

.modal {
  width: 720px;
  max-width: 100%;
  max-height: 92vh;
  overflow: auto;
  background: var(--paper);
  border-radius: 17px;
  box-shadow: 0 25px 90px #001b2766;
}

.modal.wide-modal {
  width: 860px;
}

.modal-header {
  padding: 22px 26px 18px;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 2;
}

.modal-header h2 {
  margin: 0;
}

.close-btn {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  background: #eef2ec;
  border: 0;
  border-radius: 50%;
  color: var(--ink);
  flex-shrink: 0;
}

.modal-body {
  padding: 24px 26px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.field.full {
  grid-column: 1/-1;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.field .hint {
  font-size: 11px;
  color: var(--muted);
  margin: 5px 0 0;
}

.check {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: 12px;
  margin: 10px 0;
  cursor: pointer;
}

.check input {
  margin-top: 3px;
  accent-color: var(--green);
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}

.modal-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 22px;
  align-items: center;
}

.modal-actions.end {
  justify-content: flex-end;
}

.offer-breakdown {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 14px 0;
}

.total-box {
  background: var(--ink);
  color: white;
  border-radius: 10px;
  padding: 15px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.total-box strong {
  font-size: 23px;
  direction: ltr;
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 19px 0;
}

.detail-tile {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: white;
}

.detail-tile .muted {
  font-size: 11px;
}

.detail-tile strong {
  display: block;
  font-size: 18px;
  margin-top: 3px;
}

.hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 22px 0;
}

.link-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 13px 0;
}

.brief-text {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.8;
}

.setting-grid {
  display: grid;

.wizard-step { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--sun); font-weight: 700; margin-bottom: 14px; display: inline-block; }

.wiz-links { display: grid; gap: 12px; }

/* Pure, DOM-free formatting helpers shared by the UI. Testable in Node (test_format.js). */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.ClubFormat = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const locale = lang => (lang === 'he' ? 'he-IL' : 'en-US');

  /** Escape a value for safe insertion into HTML text or attributes. */
  function escapeHtml(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ESCAPES[ch]); }

  /** Up to two initials from a display name such as "Maya Moves / Demo" -> "MM". */
  function initials(name) { return String(name ?? '').split(/[\s/]+/).filter(Boolean).slice(0, 2).map(n => n[0]).join('').toUpperCase(); }

  /** Currency amount in the viewer's locale, no trailing zeros for whole numbers. */
  function money(v, currency, lang) {
    return new Intl.NumberFormat(locale(lang), { style: 'currency', currency, minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(v);
  }

  /** Plain number with locale grouping. */
  function number(v, lang) { return new Intl.NumberFormat(locale(lang)).format(v); }

  /** Short day + month for an ISO date (YYYY-MM-DD) or timestamp. Falls back to the raw value. */
  function date(v, lang) {
    try {
      const s = String(v);
      return new Intl.DateTimeFormat(locale(lang), { day: 'numeric', month: 'short' }).format(new Date(s.includes('T') ? s : s + 'T12:00:00'));
    } catch (_) { return String(v); }
  }

  /** One CSV cell, quoted, with spreadsheet formula injection neutralised. */
  function csvCell(v) {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  /** Rows -> CSV text with a UTF-8 BOM so Excel opens Hebrew correctly. */
  function toCsv(rows) { return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }

  return { escapeHtml, initials, money, number, date, csvCell, toCsv, locale };
});

function updateDeal(){const f=$('#offer-form');if(!f)return;const aff=f.elements.deal.value==='affiliate',c=getCreator(f.elements.creatorId.value),pool=Number(f.dataset.pool);
 $('#fee-section').classList.toggle('hide',aff);$('#affiliate-section').classList.toggle('hide',!aff);
 ['production','distribution','rights'].forEach(k=>f.elements[k].disabled=aff);['creatorShare','promoCode','productPackage'].forEach(k=>f.elements[k].disabled=!aff);
 if(aff){const share=Math.min(pool,Math.max(0,Number(f.elements.creatorShare.value)||0));if(!f.elements.promoCode.dataset.touched)f.elements.promoCode.value=C.promoCodeFor(state,c,share);$('#audience-discount').textContent=(Math.round((pool-share)*100)/100)+'%';}
 updateTotal();}
function updateQuote(){const f=$('#offer-form');if(!f)return;const q=C.quote(state,f.elements.creatorId.value,f.dataset.mission),c=getCreator(f.elements.creatorId.value);['production','distribution','rights'].forEach(k=>f.elements[k].value=q[k]);$('#quote-meta').innerHTML='<div class="quote-summary">'+e(t('quoteBasedOn'))+'<br><bdi>'+number(c.audience)+'</bdi> / '+e(t('engagement'))+' <bdi>'+c.engagement+'%</bdi> / '+e(t('fit'))+' <bdi>'+c.fit+'%</bdi></div>'+(!c.metricsVerified?'<div class="mini-info warning">'+e(t('unverifiedBlocked'))+'</div>':'')+(q.manual?'<div class="mini-info warning">'+e(t('blogManual'))+'</div>':'');f.elements.deal.value=c.dealPreference==='affiliate'?'affiliate':'fee';delete f.elements.promoCode.dataset.touched;updateDeal();}
function updateTotal(){const f=$('#offer-form');if(!f)return;const n=['production','distribution','rights'].reduce((s,k)=>s+(Number(f.elements[k].value)||0),0);$('#quote-total').textContent=f.elements.deal.value==='affiliate'?t('noCashFee'):money(n,C.currency(getMission(f.dataset.mission).market));}

/* Creator application: a conversational, one-question-per-screen flow.
   Collects the same fields creator.apply needs, plus up to five social links. */
const WIZ_STEPS=['intro','name','email','market','links','platform','audience','engagement','niche','fit','deal','consent'];
const WIZ_QUESTIONS=WIZ_STEPS.length-2; // intro and consent are not counted as questions
const LINK_META=[['instagram','instagram','linkInstagram','https://instagram.com/…'],['tiktok','tiktok','linkTiktok','https://tiktok.com/@…'],['youtube','youtube','linkYoutube','https://youtube.com/@…'],['facebook','facebook','linkFacebook','https://facebook.com/…'],['website','globe','linkWebsite','https://…']];
const wizChoice=(name,value,label,desc='')=>'<button type="button" class="wiz-choice '+(String(applyData[name])===String(value)?'active':'')+'" data-action="wizChoice" data-name="'+e(name)+'" data-value="'+e(value)+'">'+e(label)+(desc?'<small>'+e(desc)+'</small>':'')+'</button>';
const wizInput=(name,type,ph,opts='')=>'<input id="wiz-input" class="wiz-input" name="'+e(name)+'" type="'+type+'" value="'+e(applyData[name]??'')+'" placeholder="'+e(ph)+'" autocomplete="off" '+opts+'>';

function wizValidate(step){
 const d=applyData;
 const email=String(d.email||'').trim();
 switch(step){
  case 'name': return String(d.name||'').trim().length>=2?'':'wizErrName';
  case 'email': return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'wizErrEmail';
  case 'market': return ['IL','US'].includes(d.market)?'':'wizErrChoice';
  case 'links': { const links=d.links||{}; const filled=Object.values(links).filter(v=>String(v||'').trim()); if(!filled.length)return 'wizErrLinks'; try{filled.forEach(v=>C.https(String(v).trim()));}catch(_){return 'wizErrLinks';} return ''; }
  case 'platform': return d.platform?'':'wizErrChoice';
  case 'audience': { const n=Number(String(d.audience||'').replace(/[,\s]/g,'')); return Number.isInteger(n)&&n>=0&&String(d.audience||'').trim()!==''?'':'wizErrAudience'; }
  case 'engagement': return d.engagement!==undefined&&d.engagement!==''?'':'wizErrChoice';
  case 'niche': return String(d.niche||'').trim().length>=3?'':'wizErrNiche';
  case 'fit': return d.fit!==undefined&&d.fit!==''?'':'wizErrChoice';
  case 'deal': return d.dealPreference?'':'wizErrChoice';
  case 'consent': return d.consent?'':'wizErrConsent';
  default: return '';
 }
}

function wizBody(step){
 const d=applyData, links=d.links||{};
 const nav=(hint=true)=>'<div class="wiz-nav"><button type="button" class="btn sun" data-action="wizNext">'+e(t('wizNext'))+icon('arrow')+'</button><button type="button" class="btn ghost" data-action="wizBack">'+e(t('wizBack'))+'</button>'+(hint?'<span class="wiz-hint">'+e(t('wizEnterHint'))+'</span>':'')+'</div>';
 const choicesNav='<div class="wiz-nav"><button type="button" class="btn ghost" data-action="wizBack">'+e(t('wizBack'))+'</button></div>';
 switch(step){
  case 'intro': return '<span class="wizard-step">SimpliiGood / Creator Club</span><h1>'+e(t('wizIntroTitle'))+'</h1><p class="sub">'+e(t('wizIntroSub'))+'</p><div class="wiz-perks"><div class="wiz-perk">'+icon('bag')+e(t('wizPerk1'))+'</div><div class="wiz-perk">'+icon('brief')+e(t('wizPerk2'))+'</div><div class="wiz-perk">'+icon('wallet')+e(t('wizPerk3'))+'</div></div><div class="wiz-nav"><button type="button" class="btn sun" data-action="wizNext">'+e(t('wizStart'))+icon('arrow')+'</button>'+(remote?'<button type="button" class="btn ghost" data-action="mode" data-view="login">'+e(t('loginTitle'))+'</button>':'<button type="button" class="btn ghost" data-action="mode" data-view="admin">'+e(t('backAdmin'))+'</button>')+'</div><p class="wiz-hint" style="margin-top:22px">'+e(t('consentToDemo'))+'</p>';
  case 'name': return '<h1>'+e(t('wizNameQ'))+'</h1><p class="sub">'+e(t('wizNameSub'))+'</p>'+wizInput('name','text',t('wizNamePh'),'maxlength="120"')+nav();
  case 'email': return '<h1>'+e(t('wizEmailQ'))+'</h1><p class="sub">'+e(t('wizEmailSub'))+'</p>'+wizInput('email','email','creator@example.test','maxlength="254" inputmode="email"')+nav();
  case 'market': return '<h1>'+e(t('wizMarketQ'))+'</h1><p class="sub">'+e(t('wizMarketSub'))+'</p><div class="wiz-choices">'+wizChoice('market','IL',t('israel'),'ILS')+wizChoice('market','US',t('usa'),'USD')+'</div>'+choicesNav;
  case 'links': return '<h1>'+e(t('wizLinksQ'))+'</h1><p class="sub">'+e(t('wizLinksSub'))+'</p><div class="wiz-links">'+LINK_META.map(([k,ic,label,ph],i)=>'<div class="wiz-link">'+icon(ic)+'<label for="wiz-link-'+k+'">'+e(t(label))+'</label><input id="wiz-link-'+k+'" '+(i===0?'data-first="1"':'')+' name="'+k+'" type="url" value="'+e(links[k]||'')+'" placeholder="'+e(ph)+'" autocomplete="off" maxlength="2000" data-wiz="links.'+k+'"></div>').join('')+'</div>'+nav();
  case 'platform': return '<h1>'+e(t('wizPlatformQ'))+'</h1><p class="sub">'+e(t('wizPlatformSub'))+'</p><div class="wiz-choices">'+['Instagram','TikTok','YouTube','Facebook','Blog','Newsletter'].map(p=>wizChoice('platform',p,p)).join('')+'</div>'+choicesNav;
  case 'audience': return '<h1>'+e(t('wizAudienceQ'))+'</h1><p class="sub">'+e(t('wizAudienceSub'))+'</p>'+wizInput('audience','text','12,000','inputmode="numeric" maxlength="12" dir="ltr"')+nav();
  case 'engagement': return '<h1>'+e(t('wizEngagementQ'))+'</h1><p class="sub">'+e(t('wizEngagementSub'))+'</p><div class="wiz-choices">'+wizChoice('engagement',0.5,t('wizEng1'))+wizChoice('engagement',2,t('wizEng2'))+wizChoice('engagement',4,t('wizEng3'))+wizChoice('engagement',6,t('wizEng4'))+wizChoice('engagement','unknown',t('wizEng0'))+'</div>'+choicesNav;
  case 'niche': return '<h1>'+e(t('wizNicheQ'))+'</h1><p class="sub">'+e(t('wizNicheSub'))+'</p>'+wizInput('niche','text',t('wizNichePh'),'maxlength="300"')+nav();
  case 'fit': return '<h1>'+e(t('wizFitQ'))+'</h1><p class="sub">'+e(t('wizFitSub'))+'</p><div class="wiz-choices">'+wizChoice('fit',95,t('wizFit1'))+wizChoice('fit',80,t('wizFit2'))+wizChoice('fit',60,t('wizFit3'))+wizChoice('fit',40,t('wizFit4'))+'</div>'+choicesNav;
  case 'deal': return '<h1>'+e(t('wizDealQ'))+'</h1><p class="sub">'+e(t('wizDealSub'))+'</p><div class="wiz-choices">'+wizChoice('dealPreference','fee',t('dealFee'),t('wizDealFeeD'))+wizChoice('dealPreference','affiliate',t('dealAffiliate'),t('wizDealAffD'))+wizChoice('dealPreference','either',t('dealEither'),t('wizDealEitherD'))+'</div>'+choicesNav;
  case 'consent': {
   const filledLinks=LINK_META.filter(([k])=>links[k]).map(([k,,label])=>t(label)).join(', ');
   const row=(k,v)=>'<div><span>'+e(t(k))+'</span><span><bdi>'+e(v)+'</bdi></span></div>';
   return '<h1>'+e(t('wizConsentQ'))+'</h1><p class="sub">'+e(t('wizConsentSub'))+'</p><form id="wiz-form"><div class="wiz-summary">'+row('wizSummaryName',d.name)+row('email',d.email)+row('market',t(d.market==='IL'?'israel':'usa'))+row('platform',d.platform)+row('followers',String(d.audience))+row('wizSummaryLinks',filledLinks)+row('niche',d.niche)+row('dealPreference',t({fee:'dealFee',affiliate:'dealAffiliate',either:'dealEither'}[d.dealPreference]))+'</div><label class="check"><input type="checkbox" name="consent" data-wiz="consent" '+(d.consent?'checked':'')+'> <span>'+e(t('consent'))+'</span></label><div class="wiz-nav"><button type="submit" class="btn sun">'+e(t('wizSend'))+icon('arrow')+'</button><button type="button" class="btn ghost" data-action="wizBack">'+e(t('wizBack'))+'</button></div></form>';
  }
  default: return '';
 }
}

function renderApply(){
 document.documentElement.dir=lang==='he'?'rtl':'ltr';
 const step=WIZ_STEPS[applyStep], qIndex=applyStep; // intro = 0
 const progress=applyDone?100:Math.round((applyStep/(WIZ_STEPS.length-1))*100);
 const stepLabel=step==='intro'||step==='consent'||applyDone?'':'<span class="wizard-step">'+e(t('wizStepOf').replace('{n}',qIndex).replace('{total}',WIZ_QUESTIONS))+'</span>';
 const body=applyDone?'<div class="wiz-done">'+icon('heart')+'<h1>'+e(t('wizDoneTitle'))+'</h1><p class="sub">'+e(t('wizDoneSub'))+'</p><div class="wiz-nav"><button type="button" class="btn sun" id="wiz-done" data-action="wizDone">'+e(t('wizDoneAction'))+'</button></div></div>':stepLabel+wizBody(step)+(applyError?'<div class="wiz-error" role="alert">'+e(t(applyError))+'</div>':'');
 $('#app').innerHTML='<div class="wizard"><header class="wizard-top"><div><div class="brandmark">Simplii<span>Good</span></div><div class="brand-sub">CREATOR CLUB</div></div><button class="lang-btn" data-action="lang" aria-label="Change language">'+(lang==='he'?'EN':'HE')+'</button><div class="wizard-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+progress+'"><span style="width:'+progress+'%"></span></div></header><div class="wizard-body"><div class="wizard-card" data-step="'+e(step)+'">'+body+'</div></div></div>';
 setTimeout(()=>($('#wiz-input')||$('[data-first="1"]'))?.focus(),0);
}

function wizCapture(){ // pull free-text values from the DOM before moving on
 const inp=$('#wiz-input'); if(inp) applyData[inp.name]=inp.value;
 document.querySelectorAll('[data-wiz]').forEach(el=>{const key=el.dataset.wiz; const val=el.type==='checkbox'?el.checked:el.value; if(key.startsWith('links.')){applyData.links=applyData.links||{};applyData.links[key.slice(6)]=val;}else applyData[key]=val;});
}
function wizNext(){
 wizCapture();
 const step=WIZ_STEPS[applyStep], err=wizValidate(step);
 if(err){applyError=err;render();return;}
 applyError='';
 if(applyStep<WIZ_STEPS.length-1){applyStep++;render();window.scrollTo(0,0);}
}
function wizBack(){wizCapture();applyError='';if(applyStep>0)applyStep--;render();}
function wizPick(name,value){const parsed=value==='unknown'?value:(isNaN(Number(value))||value===''?value:Number(value));applyData[name]=parsed;applyError='';if(applyStep<WIZ_STEPS.length-1)applyStep++;render();window.scrollTo(0,0);}
function wizReset(){applyStep=0;applyData={};applyError='';applyDone=false;}

function submitApplication(){
 wizCapture();
 const err=wizValidate('consent'); if(err){applyError=err;render();return;}
 const d=applyData;
 const links={}; for(const [k] of LINK_META){const v=String((d.links||{})[k]||'').trim(); if(v)links[k]=v;}
 const payload={name:String(d.name||'').trim(),email:String(d.email||'').trim(),market:d.market,platform:d.platform,audience:Number(String(d.audience).replace(/[,\s]/g,'')),engagement:d.engagement==='unknown'?2:Number(d.engagement),fit:Number(d.fit),niche:String(d.niche||'').trim(),links,dealPreference:d.dealPreference,consent:!!d.consent};
 const done=()=>{applyDone=true;applyError='';render();window.scrollTo(0,0);};
 const showError=msg=>{applyError=msg;render();};
 if(remote){remoteAct('creator.apply',payload,{onSuccess:done,onError:showError});return;}
 try{const next=C.dispatch(state,'creator.apply',payload,{role:'public'});persist(next);done();}catch(e2){showError(e2.message);}
}

/* Event wiring, cross-tab sync and boot. Loaded last. */
const data=f=>Object.fromEntries(new FormData(f).entries());
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id;
 if(a==='close')closeModal();
 else if(a==='menu')$('#sidebar')?.classList.toggle('open');
 else if(a==='lang'){lang=lang==='he'?'en':'he';closeModal();render();}
 else if(a==='nav'){if(remote&&remote.role==='creator')return;view='admin';page=target.dataset.page;closeModal();render();window.scrollTo(0,0);}
 else if(a==='mode'){view=remote?(remote.authenticated?(remote.role==='creator'?'creator':'admin'):'login'):target.dataset.view;if(view==='apply')wizReset();closeModal();render();window.scrollTo(0,0);}
 else if(a==='logout')logout();
 else if(a==='loginAgain'){linkSentTo='';devLink='';render();}
 else if(a==='market'){market=target.dataset.market;render();}
 else if(a==='newMission')newMission();
 else if(a==='missionDetail')missionDetail(id);
 else if(a==='creatorDetail')creatorDetail(id);
 else if(a==='approveCreator')act('creator.approve',{id});
 else if(a==='rejectCreator'){if(confirm(t('rejectConfirm'))){const reason=prompt(t('rejectReason'),'');if(reason)act('creator.reject',{id,reason});}}
 else if(a==='editMission')editMission(id);
 else if(a==='archiveMission'){if(confirm(t('archiveConfirm')))act('mission.archive',{id});}
 else if(a==='restoreMission')act('mission.restore',{id});
 else if(a==='toggleArchived'){showArchived=!showArchived;render();}
 else if(a==='verifyMetrics'){if(confirm(t('manualOnly')+'\n\n'+t('verifyMetrics')+'?'))act('creator.verify',{id,confirmed:true});}
 else if(a==='offer')offerMission(id);
 else if(a==='work')workModal(id);
 else if(a==='apply'){wizReset();view='apply';closeModal();render();window.scrollTo(0,0);}
 else if(a==='wizNext')wizNext();
 else if(a==='wizBack')wizBack();
 else if(a==='wizChoice')wizPick(target.dataset.name,target.dataset.value);
 else if(a==='wizDone'){wizReset();if(remote){view=remote.authenticated?'admin':'login';}else{view='admin';page='creators';market='all';}render();window.scrollTo(0,0);}
 else if(a==='buildBrief'){const f=$('#mission-form'),l=(f.elements.market?f.elements.market.value:f.dataset.market)==='US'?'en':'he';f.elements.brief.value=TRANSLATIONS[l].briefDefault;toast(t('briefGenerated'));}
 else if(a==='scroll-work')$('#my-work')?.scrollIntoView({behavior:'smooth',block:'start'});
 else if(a==='cancelWork'){if(confirm(t('cancelConfirm'))){const reason=prompt(t('cancelReason'),'Demo cancellation');if(reason)act('assignment.cancel',{id,reason});}}
 else if(a==='decline'){if(confirm(t('declineConfirm')))act('assignment.decline',{id});}
 else if(a==='export'){download('simpliigood-creator-club-backup-'+C.today()+'.json',safeJSON(state),'application/json');toast(t('exported'));}
 else if(a==='exportCsv')exportCsv();
 else if(a==='import')$('#import-file')?.click();
 else if(a==='reset'){if(confirm(t('resetConfirm'))){persist(C.createSeed());market='all';creatorId='c3';render();toast(t('saved'));}}
});
document.addEventListener('input',event=>{if(event.target.id==='creator-search'){search=event.target.value;$('#creator-table').innerHTML=creatorsTable();}if(event.target.closest('#offer-form')){if(['production','distribution','rights'].includes(event.target.name))updateTotal();if(event.target.name==='creatorShare')updateDeal();if(event.target.name==='promoCode')event.target.dataset.touched='1';}});
document.addEventListener('change',async event=>{
 if(event.target.id==='creator-picker'){creatorId=event.target.value;render();}
 if(event.target.closest('#offer-form')&&event.target.name==='creatorId')updateQuote();
 if(event.target.closest('#offer-form')&&event.target.name==='deal')updateDeal();
 if(event.target.id==='import-file'){
  const file=event.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error();const next=JSON.parse(await file.text());C.validateState(next);if(confirm(t('importConfirm'))){persist(next);render();toast(t('imported'));}}catch(_){toast(t('invalidBackup'),true);}finally{event.target.value='';}
 }
});
document.addEventListener('submit',event=>{
 const f=event.target;if(!(f instanceof HTMLFormElement))return;event.preventDefault();const p=data(f),id=f.dataset.id;
 if(f.id==='mission-form')act(id?'mission.update':'mission.create',id?{...p,id}:p);
 else if(f.id==='offer-form')act('assignment.offer',{...p,missionId:f.dataset.mission});
 else if(f.id==='accept-form')act('assignment.accept',{id,confirmed:f.elements.confirmed.checked});
 else if(f.id==='content-form')act('assignment.submit',{id,...p});
 else if(f.id==='publication-form')act('assignment.publish',{id,url:p.url});
 else if(f.id==='review-form')act('assignment.review',{id,decision:event.submitter?.value,feedback:p.feedback,checks:[0,1,2,3].map(i=>f.elements['check'+i].checked)});
 else if(f.id==='verify-form')act('assignment.verify',{id,confirmed:f.elements.confirmed.checked});
 else if(f.id==='payment-form')act('assignment.record',{id,reference:p.reference,salesTotal:p.salesTotal,confirmed:f.elements.confirmed.checked});
 else if(f.id==='affiliate-form')act('settings.affiliate',{pool:p.pool,creatorShare:p.creatorShare});
 else if(f.id==='rates-form'){const rates={};['IL','US'].forEach(m=>{rates[m]={production:{},distribution:[0,1,2,3,4].map(i=>p[m+'-d-'+i])};['reel','story','blog'].forEach(k=>rates[m].production[k]=p[m+'-p-'+k]);});act('settings.rates',{rates});}
 else if(f.id==='wiz-form')submitApplication();
 else if(f.id==='login-form'){
  requestLink(p.email).then(j=>{linkSentTo=p.email;devLink=j.devLink||'';render();}).catch(err=>{const el=$('#login-errors');el.textContent=t(err.message)||err.message;el.classList.remove('hide');});
 }
});
document.addEventListener('keydown',event=>{
 if(event.key==='Enter'&&view==='apply'&&!applyDone&&event.target.matches('.wizard input:not([type=checkbox])')){event.preventDefault();wizNext();return;}
 const modal=$('#modal-root .modal');if(!modal)return;if(event.key==='Escape'){closeModal();return;}
