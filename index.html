<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none';">
<title>SimpliiGood Creator Club | Local prototype</title>
<style>
:root {
  --ink: #154048;
  --muted: #687979;
  --sun: #fee62d;
  --paper: #f5f7f3;
  --line: #dde5df;
  --green: #287e63;
  --soft: #eaf2eb;
  --white: #fff;
  --danger: #a34235;
  --shadow: 0 12px 42px rgba(21,64,72,.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.55 Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a,
input,
select,
textarea {
  touch-action: manipulation;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .46;
  cursor: not-allowed;
}

a {
  color: var(--ink);
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #319980;
  outline-offset: 3px;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  font-size: clamp(27px,3vw,39px);
  letter-spacing: -1.1px;
  line-height: 1.2;
  margin-bottom: 12px;
}

h2 {
  font-size: 21px;
  line-height: 1.3;
  margin-bottom: 10px;
}

h3 {
  font-size: 17px;
  line-height: 1.4;
  margin-bottom: 7px;
}

p {
  margin-bottom: 13px;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 12px;
}

.tiny {
  font-size: 11px;
}

.ltr {
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 1.8px;
  font-weight: 700;
  text-transform: uppercase;
  direction: ltr;
  display: block;
  margin-bottom: 13px;
}

.icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  vertical-align: middle;
}

.sidebar {
  width: 235px;
  position: fixed;
  inset-block: 0;
  inset-inline-start: 0;
  background: var(--ink);
  color: white;
  z-index: 20;
  display: flex;
  flex-direction: column;
  padding: 29px 18px;
}

.brandmark {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
  direction: ltr;
  text-align: start;
  display: inline-block;
}

.brandmark span {
  color: var(--sun);
}

.brand-sub {
  font-size: 11px;
  letter-spacing: 2.4px;
  margin: 9px 0 34px;
  direction: ltr;
  opacity: .75;
}

.side-divider {
  height: 1px;
  background: #ffffff20;
  margin-bottom: 19px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  margin: 4px 0;
  width: 100%;
  border: 0;
  background: transparent;
  color: #d6e3df;
  text-align: start;
  border-radius: 11px;
  font-size: 13px;
}

.nav-item:hover {
  background: #ffffff0c;
}

.nav-item.active {
  background: var(--sun);
  color: var(--ink);
  font-weight: 700;
}

.nav-count {
  margin-inline-start: auto;
  min-width: 21px;
  line-height: 20px;
  border-radius: 5px;
  text-align: center;
  font-size: 11px;
  background: #ffffff18;
}

.nav-item.active .nav-count {
  background: #15404812;
}

.side-bottom {
  margin-top: auto;
}

.side-note {
  border: 1px solid #ffffff25;
  border-radius: 13px;
  padding: 15px;
  margin: 16px 0 12px;
  font-size: 12px;
  color: #d6e3df;
}

.side-note .dot {
  background: var(--sun);
}

.side-footer {
  font-size: 10px;
  letter-spacing: .4px;
  color: #94b0af;
  direction: ltr;
  margin-top: 16px;
}

.app-shell {
  margin-inline-start: 235px;
  min-height: 100vh;
}

.topbar {
  padding: 19px 35px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: #ffffffbd;
  min-height: 82px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.mode-switch {
  display: flex;
  gap: 3px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 4px;
}

.mode-switch button {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 12px;
}

.mode-switch button.active {
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 1px 4px #15404816;
  font-weight: 700;
}

.lang-btn {
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  padding: 8px 11px;
  color: var(--ink);
}

.demo-pill,
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  padding: 4px 8px;
  background: var(--soft);
  white-space: nowrap;
}

.demo-pill {
  background: #fff8cc;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: var(--green);
}

.content {
  padding: 25px 35px 40px;
  max-width: 1550px;
  margin: auto;
}

.demo-banner {
  background: #fffbe6;
  border: 1px solid #eee2a5;
  border-radius: 9px;
  padding: 9px 14px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  color: #6e6130;
}

.page-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 7px 0 23px;
}

.page-title p {
  color: var(--muted);
  margin: 0;
}

.page-title h1 {
  font-size: 30px;
}

.btn {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  font-weight: 700;
  background: var(--ink);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  text-decoration: none;
  min-height: 41px;
}

.btn.sun {
  background: var(--sun);
  color: var(--ink);
}

.btn.secondary {
  background: white;
  border: 1px solid var(--line);
  color: var(--ink);
}

.btn.ghost {
  background: transparent;
  color: var(--ink);
  padding: 8px;
}

.btn.danger {
  background: #faeee9;
  color: var(--danger);
}

.btn.sm {
  padding: 7px 10px;
  min-height: 33px;
  font-size: 12px;
}

.btn.wide {
  width: 100%;
}

.hero {
  background: var(--ink);
  color: white;
  border-radius: 19px;
  padding: 30px 32px;
  display: grid;
  grid-template-columns: minmax(0,1fr) 260px;
  position: relative;
  overflow: hidden;
  margin-bottom: 23px;
  min-height: 240px;
  gap: 20px;
}

.hero p {
  color: #d8e7de;
  max-width: 540px;
  font-size: 14px;
}

.hero .eyebrow {
  color: #d4de83;
}

.hero h1 {
  font-size: 37px;
  max-width: 600px;
}

.hero-art {
  position: relative;
  min-height: 168px;
  align-self: center;
  pointer-events: none;
  direction: ltr;
}

.sun-disc {
  height: 150px;
  width: 150px;
  position: absolute;
  left: 58px;
  top: 5px;
  background: var(--sun);
  border-radius: 50%;
}

.cube {
  position: absolute;
  width: 91px;
  height: 91px;
  border-radius: 20px;
  box-shadow: 11px 12px 0 #10343a;
  transform: rotate(-15deg);
  background: #30775f;
  border: 1px solid #4c8e75;
  left: 32px;
  top: 50px;
}

.cube.two {
  background: #62a171;
  border-color: #86b984;
  width: 67px;
  height: 67px;
  left: 125px;
  top: 95px;
  transform: rotate(14deg);
  box-shadow: 7px 9px 0 #10343a;
}

.hero-caption {
  position: absolute;
  left: 28px;
  top: 184px;
  letter-spacing: 1.1px;
  font-size: 10px;
  color: #c4d6cd;
}

.hero-tag {
  position: absolute;
  right: 0;
  top: 16px;
  font-size: 10px;
  padding: 7px 10px;
  background: #ffffff17;
  border: 1px solid #ffffff25;
  border-radius: 8px;
  transform: rotate(8deg);
}

.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.hero .btn.secondary {
  background: #ffffff0c;
  border-color: #ffffff40;
  color: white;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 15px;
  margin-bottom: 23px;
}

.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 21px;
}

.kpi-label {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}

.kpi-value {
  font-size: 33px;
  line-height: 1.15;
  letter-spacing: -1px;
  font-weight: 700;
}

.kpi-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 9px;
}

.kpi-currency {
  font-size: 21px;
  line-height: 1.6;
  font-weight: 700;
  letter-spacing: -.4px;
}

.split {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 20px;
  margin-bottom: 23px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.section-head h2 {
  margin: 0;
}

.section-head p {
  margin: 4px 0 0;
  font-size: 12px;
}

.action-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-top: 1px solid #edf1ed;
  font-size: 13px;
}

.action-row:first-of-type {
  border-top: 0;
}

.row-start {
  display: flex;
  gap: 11px;
  align-items: center;
}

.action-icon {
  background: var(--soft);
  width: 33px;
  height: 33px;
  border-radius: 9px;
  display: grid;
  place-items: center;
}

.action-row strong {
  font-size: 18px;
}

.journey {
  display: grid;
  grid-template-columns: repeat(6,1fr);
  gap: 6px;
  margin-top: 20px;
}

.journey-step {
  text-align: center;
  position: relative;
  font-size: 11px;
}

.journey-step:after {
  content: '';
  position: absolute;
  top: 18px;
  inset-inline-start: 60%;
  width: 80%;
  height: 1px;
  background: var(--line);
}

.journey-step:last-child:after {
  display: none;
}

.step-number {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--soft);
  border-radius: 50%;
  font-weight: 700;
  margin: 0 auto 11px;
  position: relative;
  z-index: 1;
}

.journey-step:first-child .step-number,
.journey-step:last-child .step-number {
  background: var(--sun);
}

.mission-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 17px;
}

.mission-card {
  padding: 0;
  overflow: hidden;
}

.mission-top {
  height: 83px;
  background: var(--soft);
  padding: 17px 21px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.mission-top.yellow {
  background: #fff6ad;
}

.mission-art {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border: 1px solid #15404825;
  border-radius: 13px;
  background: #ffffff55;
}

.mission-art .icon {
  width: 26px;
  height: 26px;
}

.mission-body {
  padding: 20px 21px;
}

.mission-body h3 {
  font-size: 19px;
  margin-bottom: 5px;
}

.mission-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 12px 0 17px;
}

.pill.outline {
  background: transparent;
  border: 1px solid var(--line);
  font-weight: 400;
}

.mission-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}

.progress {
  height: 5px;
  background: var(--soft);
  border-radius: 5px;
  margin: 9px 0 13px;
  overflow: hidden;
}

.progress>span {
  height: 100%;
  display: block;
  background: var(--green);
  border-radius: 5px;
}

.mission-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  gap: 10px;
}

.section-spacer {
  margin-top: 27px;
}

.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.filter-tabs {
  display: flex;
  gap: 4px;
  background: #e8eee8;
  padding: 4px;
  border-radius: 9px;
}

.filter-tabs button {
  padding: 7px 14px;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  font-size: 12px;
}

.filter-tabs .active {
  background: white;
  color: var(--ink);
  box-shadow: 0 1px 3px #15404810;
  font-weight: 700;
}

.search {
  flex: 1;
  min-width: 180px;
  max-width: 330px;
}

.input,
input:not([type=checkbox]):not([type=file]),
select,
textarea {
  border: 1px solid #cfdad2;
  border-radius: 8px;
  background: white;
  color: var(--ink);
  padding: 10px 12px;
  width: 100%;
  min-height: 43px;
}

textarea {
  resize: vertical;
  min-height: 105px;
}

select {
  cursor: pointer;
}

.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: start;
  white-space: nowrap;
}

th {
  font-weight: 400;
  background: #f9fbf7;
  color: var(--muted);
  font-size: 11px;
  padding: 14px 17px;
  border-bottom: 1px solid var(--line);
}

td {
  padding: 17px;
  font-size: 13px;
  border-bottom: 1px solid #ecf0eb;
}

tr:last-child td {
  border-bottom: 0;
}

.creator-cell {
  display: flex;
  gap: 11px;
  align-items: center;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  background: #e5efe4;
  flex-shrink: 0;
  direction: ltr;
}

.avatar.gold {
  background: #fff2af;
}

.avatar.large {
  width: 59px;
  height: 59px;
  border-radius: 18px;
  font-size: 18px;
}

.name-btn {
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 0;
  text-align: start;
  font-weight: 700;
  font-size: 13px;
}

.status {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 10px;
  background: #edf2ed;
  color: #50685a;
  white-space: nowrap;
}

.status.submitted,
.status.pending,
.status.offered {
  background: #fff4ce;
  color: #826a18;
}

.status.changes {
  background: #fff0e7;
  color: #925b33;
}

.status.published,
.status.payable {
  background: #e9f2f8;
  color: #356985;
}

.status.approved,
.status.paid,
.status.active {
  background: #e5f2e8;
  color: #2f7254;
}

.status.cancelled {
  background: #f0eded;
  color: #777;
}

.empty {
  text-align: center;
  padding: 48px 25px;
  color: var(--muted);
  font-size: 14px;
}

.mini-info {
  border-radius: 10px;
  padding: 12px 14px;
  background: #f2f6f0;
  font-size: 12px;
  margin-top: 15px;
}

.mini-info.warning {
  background: #fff9df;
  border: 1px solid #eee5b7;
  color: #7a6638;
}

.mini-info.danger {
  background: #fcf0eb;
  color: #8d4b39;
}

.log-row {
  display: flex;
  gap: 11px;
  padding: 12px 0;
  border-bottom: 1px solid #eef2ed;
  font-size: 12px;
  align-items: center;
}

.log-time {
  margin-inline-start: auto;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.log-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.footer {
  font-size: 10px;
  color: #8b9b91;
  margin-top: 30px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #092c37a1;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(3px);
}

.modal {
  width: 720px;
  max-width: 100%;
  max-height: 92vh;
  overflow: auto;
  background: var(--paper);
  border-radius: 17px;
  box-shadow: 0 25px 90px #001b2766;
}

.modal.wide-modal {
  width: 860px;
}

.modal-header {
  padding: 22px 26px 18px;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 2;
}

.modal-header h2 {
  margin: 0;
}

.close-btn {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  background: #eef2ec;
  border: 0;
  border-radius: 50%;
  color: var(--ink);
  flex-shrink: 0;
}

.modal-body {
  padding: 24px 26px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.field.full {
  grid-column: 1/-1;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.field .hint {
  font-size: 11px;
  color: var(--muted);
  margin: 5px 0 0;
}

.check {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: 12px;
  margin: 10px 0;
  cursor: pointer;
}

.check input {
  margin-top: 3px;
  accent-color: var(--green);
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}

.modal-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 22px;
  align-items: center;
}

.modal-actions.end {
  justify-content: flex-end;
}

.offer-breakdown {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 14px 0;
}

.total-box {
  background: var(--ink);
  color: white;
  border-radius: 10px;
  padding: 15px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.total-box strong {
  font-size: 23px;
  direction: ltr;
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 19px 0;
}

.detail-tile {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: white;
}

.detail-tile .muted {
  font-size: 11px;
}

.detail-tile strong {
  display: block;
  font-size: 18px;
  margin-top: 3px;
}

.hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 22px 0;
}

.link-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 13px 0;
}

.brief-text {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.8;
}

.setting-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}

.rates-table input {
  min-width: 70px;
  max-width: 110px;
  min-height: 35px!important;
  padding: 6px 9px!important;
  direction: ltr;
}

.connection {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}

.connection:last-child {
  border-bottom: 0;
}

.creator-picker {
  max-width: 290px;
}

.work-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px;
}

.work-card h3 {
  margin-top: 14px;
}

.work-card .fee {
  font-size: 25px;
  font-weight: 700;
  margin: 16px 0 5px;
}

.creator-layout .hero {
  min-height: 240px;
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: white;
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 14px 23px;
  font-size: 13px;
  z-index: 100;
  max-width: 90vw;
}

.toast.error {
  background: #853c31;
}

.inline-error {
  background: #fae9e4;
  color: #923e30;
  border-radius: 8px;
  padding: 11px 13px;
  margin-bottom: 13px;
  font-size: 12px;
}

.onboarding {
  max-width: 750px;
  margin: 0 auto;
}

.onboarding-header {
  padding: 25px 0;
  text-align: center;
}

.onboarding-header .brandmark {
  color: var(--ink);
}

.onboarding-header .brandmark span {
  color: var(--green);
}

.hide {
  display: none!important;
}

.menu-toggle {
  display: none;
}

.mission-detail-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.copy-paragraph {
  font-size: 13px;
  line-height: 1.85;
  white-space: pre-wrap;
}

.content-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.review-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.review-card .creator-cell {
  align-items: flex-start;
}

.review-card h3 {
  margin: 3px 0 5px;
}

.pill-row {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.review-card .review-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

.quote-summary {
  font-size: 12px;
  color: var(--muted);
  margin: 10px 0;
}

.mission-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.step-list p {
  font-size: 12px;
  margin-bottom: 9px;
}

.metric-pair {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.hero-note {
  font-size: 10px!important;
  margin-top: 15px;
  margin-bottom: 0!important;
  color: #b5c6bd!important;
}

.screen-reader-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

body.modal-open {
  overflow: hidden;
}

[dir=rtl] .brandmark,
[dir=rtl] .brand-sub {
  text-align: right;
}

[dir=rtl] .arrow-icon {
  transform: scaleX(-1);
}

@media(min-width:1500px) {
  .content {
    padding-inline: 45px;
  }
  .hero {
    grid-template-columns: 1fr 320px;
  }
  .hero-art {
    width: 260px;
    justify-self: center;
  }
}

@media(max-width:1150px) {
  .sidebar {
    width: 205px;
    padding-inline: 13px;
  }
  .app-shell {
    margin-inline-start: 205px;
  }
  .content {
    padding: 22px;
  }
  .topbar {
    padding: 17px 22px;
  }
  .hero {
    grid-template-columns: 1fr 185px;
    padding: 27px 25px;
  }
  .hero-art {
    transform: scale(.82);
    transform-origin: center;
  }
  .hero h1 {
    font-size: 30px;
  }
  .kpis {
    gap: 10px;
  }
  .card {
    padding: 17px;
  }
  .kpi-currency {
    font-size: 18px;
  }
  .split {
    grid-template-columns: 1fr;
  }
  .mission-body {
    padding: 18px;
  }
  .brandmark {
    font-size: 29px;
  }
}

@media(max-width:780px) {
  .sidebar {
    transform: translateX(-110%);
    width: 235px;
    transition: transform .2s;
  }
  .sidebar.open {
    transform: none;
  }
  [dir=rtl] .sidebar {
    transform: translateX(110%);
  }
  [dir=rtl] .sidebar.open {
    transform: none;
  }
  .app-shell {
    margin-inline-start: 0;
  }
  .menu-toggle {
    display: inline-flex;
    border: 0;
    background: transparent;
    color: var(--ink);
  }
  .topbar {
    padding: 12px 15px;
    min-height: 70px;
    gap: 8px;
  }
  .top-title {
    display: none;
  }
  .content {
    padding: 17px 15px;
  }
  .mode-switch button {
    padding: 6px 8px;
    font-size: 11px;
  }
  .top-actions {
    gap: 6px;
  }
  .demo-pill {
    font-size: 10px;
  }
  .hero {
    grid-template-columns: 1fr 120px;
    gap: 0;
    padding: 23px 21px;
    min-height: 220px;
  }
  .hero-art {
    transform: scale(.6);
    transform-origin: center;
    width: 160px;
    margin-inline-start: -20px;
  }
  .hero h1 {
    font-size: 26px;
    letter-spacing: -.7px;
  }
  .hero p {
    font-size: 12px;
  }
  .hero-actions .btn {
    font-size: 11px;
    padding: 9px 11px;
  }
  .hero .eyebrow {
    font-size: 8px;
    letter-spacing: 1px;
  }
  .kpis {
    grid-template-columns: 1fr 1fr;
  }
  .kpi-value {
    font-size: 28px;
  }
  .kpi-currency {
    font-size: 20px;
  }
  .mission-grid,
  .work-grid,
  .setting-grid {
    grid-template-columns: 1fr;
  }
  .page-title {
    align-items: flex-start;
    gap: 13px;
  }
  .page-title h1 {
    font-size: 25px;
  }
  .page-title p {
    font-size: 12px;
  }
  .page-title .btn {
    padding: 9px 11px;
    white-space: nowrap;
    font-size: 11px;
  }
  .demo-banner {
    font-size: 10px;
    align-items: flex-start;
  }
  .form-grid {
    grid-template-columns: 1fr;
  }
  .field.full {
    grid-column: auto;
  }
  .modal-backdrop {
    padding: 10px;
  }
  .modal {
    max-height: 95vh;
  }
  .modal-header {
    padding: 17px 19px;
  }
  .modal-body {
    padding: 20px 18px;
  }
  .modal-header h2 {
    font-size: 19px;
  }
  .offer-breakdown {
    gap: 7px;
  }
  .offer-breakdown label {
    font-size: 10px;
  }
  .offer-breakdown input {
    padding: 9px!important;
  }
  .details-grid {
    grid-template-columns: repeat(2,1fr);
  }
  .review-card {
    align-items: flex-start;
    flex-direction: column;
    gap: 14px;
  }
  .review-card .review-actions {
    width: 100%;
    justify-content: space-between;
  }
  .footer {
    font-size: 9px;
  }
  .mission-detail-top {
    align-items: flex-start;
  }
  .creator-picker {
    max-width: 240px;
  }
  .journey {
    gap: 3px;
  }
  .journey-step {
    font-size: 10px;
  }
  .step-number {
    width: 31px;
    height: 31px;
  }
  .journey-step:after {
    top: 15px;
  }
  .section-head h2 {
    font-size: 19px;
  }
  .hero-caption {
    top: 180px;
  }
  .creator-layout .hero {
    min-height: 220px;
  }
}

@media(max-width:410px) {
  .hero {
    grid-template-columns: 1fr;
  }
  .hero-art {
    display: none;
  }
  .top-actions .demo-pill {
    display: none;
  }
  .hero h1 {
    font-size: 28px;
  }
  .offer-breakdown {
    grid-template-columns: 1fr;
  }
  .page-title {
    flex-direction: column;
  }
  .kpi-currency {
    font-size: 18px;
  }
  .sidebar {
    width: 225px;
  }
  .topbar .mode-switch {
    gap: 0;
  }
  .topbar .mode-switch button {
    font-size: 10px;
  }
}

@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior: auto!important;
    transition: none!important;
  }
}

  function dispatch(original, command, p, actor={role:'admin'}) {

      else if(command==='assignment.decline'){creator(a);stage(a,['offered']);a.status='cancelled';a.cancelReason='Creator declined demo offer';}
      else if(command==='assignment.submit'){creator(a);stage(a,['accepted','changes']);a.contentUrl=https(p.url);a.notes=text(p.notes||'',2000);a.revision++;a.status='submitted';a.submittedAt=now;}
      else if(command==='assignment.review'){
        admin();stage(a,['submitted']);
        if(p.decision==='changes'){a.feedback=text(p.feedback,2000,3);a.status='changes';a.checks=[];}
        else if(p.decision==='approved'){if(p.checks?.length!==4||!p.checks.every(v=>v===true))fail('checksRequired');a.checks=[true,true,true,true];a.feedback=text(p.feedback||'',2000);a.status='approved';a.approvedAt=now;}
        else fail('statusInvalid');
        a.history.push({at:now,decision:p.decision,feedback:a.feedback});
      }
      else if(command==='assignment.publish'){creator(a);stage(a,['approved']);a.publicationUrl=https(p.url);a.publishedAt=now;a.status='published';}
      else if(command==='assignment.verify'){admin();stage(a,['published']);if(!p.confirmed)fail('consentRequired');a.verifiedAt=now;a.status='payable';}
      else if(command==='assignment.record'){admin();stage(a,['payable']);if(!p.confirmed)fail('consentRequired');a.payment={reference:text(p.reference,100,3),at:now,mode:'demo-manual-record'};a.status='paid';}
      else if(command==='assignment.cancel'){admin();stage(a,['offered','accepted','submitted','changes','approved']);a.cancelReason=text(p.reason,500,3);a.status='cancelled';}
      else fail('statusInvalid');
    } else if(command==='settings.rates'){
      admin();for(const market of ['IL','US']){const r=p.rates?.[market];if(!r||r.distribution?.length!==5)fail('required');s.rates[market]={production:{},distribution:r.distribution.map(v=>money(num(v)))};['reel','story','blog'].forEach(k=>s.rates[market].production[k]=money(num(r.production[k])));}
      s.ratesVersion++;subject='v'+s.ratesVersion;
    }else fail('statusInvalid');
    s.revision++;s.updatedAt=now;s.activity.unshift({id:uid('log'),at:now,action:command,actor:actor.role,subject});s.activity=s.activity.slice(0,5000);validateState(s);return s;
  }
  return {VERSION,createSeed,validateState,dispatch,quote,allocation,missionCount,stats,currency,https,today,future,titleText,briefText,statuses};
});
</script>

n><section class="split section-spacer"><div class="card"><h2>'+e(t('activity'))+'</h2>'+state.activity.slice(0,5).map(log=>'<div class="log-row"><span class="log-dot"></span><div>'+e(actionLabel(log.action))+'<div class="tiny muted">'+e(log.subject)+'</div></div><span class="log-time">'+date(log.at)+'</span></div>').join('')+'<p class="tiny muted" style="margin:12px 0 0">'+e(t('auditDemo'))+'</p></div><div class="card step-list"><span class="eyebrow">'+e(t('startHere'))+'</span><h2>'+e(t('howTo'))+'</h2><p>'+e(t('demoStep1'))+'</p><p>'+e(t('demoStep2'))+'</p><p>'+e(t('demoStep3'))+'</p></div></section>';

 const used=C.allocation(state,m.id),count=C.missionCount(state,m.id),cur=C.currency(m.market),pct=Math.min(100,used/m.budget*100);

function renderApply(){document.documentElement.dir=lang==='he'?'rtl':'ltr';$('#app').innerHTML='<div class="content onboarding"><header class="onboarding-header"><div class="brandmark">Simplii<span>Good</span></div><div class="brand-sub" style="margin:12px 0 20px">CREATOR CLUB</div><button class="lang-btn" data-action="lang">'+(lang==='he'?'EN':'HE')+'</button></header><div class="demo-banner">'+e(t('publicDemo'))+'</div><div class="page-title"><div><h1>'+e(t('signupTitle'))+'</h1><p>'+e(t('signupSub'))+'</p></div></div><section class="card"><form id="apply-form"><div class="form-grid">'+field('displayName','name','','text','required maxlength="120" autocomplete="off"')+field('email','email','','email','required maxlength="254" placeholder="creator@example.test" autocomplete="off"')+select('market','market',[['IL',marketName('IL')],['US',marketName('US')]],'IL')+select('platform','platform',['Instagram','TikTok','Blog','Newsletter','YouTube'].map(k=>[k,k]),'Instagram')+field('audienceLabel','audience','','number','required min="0" max="1000000000" step="1"')+field('engagementLabel','engagement','','number','required min="0" max="100" step="0.1"')+field('fitLabel','fit','','number','required min="0" max="100" step="0.1"')+field('niche','niche','','text','required maxlength="300"')+'<div class="field full"><label for="profile-url">'+e(t('profileUrl'))+'</label><input id="profile-url" name="url" type="url" required placeholder="https://example.com/profile" maxlength="2000"></div></div><div class="mini-info warning">'+e(t('noteMetrics'))+'</div>'+checkbox('consent','consent')+'<div id="application-errors" role="alert" class="inline-error hide"></div><div class="modal-actions"><button type="submit" class="btn sun">'+e(t('apply'))+'</button>'+btn('backAdmin','mode','data-view="admin"','secondary')+'</div></form></section></div>';}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){const rows=[['DEMO ONLY - NO MONEY TRANSFERRED'],['assignment_id','creator','market','mission','creation_fee','publication_fee','rights_fee','total','currency','status','reference','recorded_at']];state.assignments.filter(a=>['payable','paid'].includes(a.status)&&forMarket(getMission(a.missionId).market)).forEach(a=>{const m=getMission(a.missionId);rows.push([a.id,getCreator(a.creatorId).name,m.market,title(m),a.fees.production,a.fees.distribution,a.fees.rights,a.fees.total,a.fees.currency,a.status,a.payment?.reference||'',a.payment?.at||'']);});download('simpliigood-demo-payments-'+C.today()+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
const data=f=>Object.fromEntries(new FormData(f).entries());
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id;
 if(a==='close')closeModal();
 else if(a==='menu')$('#sidebar')?.classList.toggle('open');
 else if(a==='lang'){lang=lang==='he'?'en':'he';closeModal();render();}
 else if(a==='nav'){view='admin';page=target.dataset.page;closeModal();render();window.scrollTo(0,0);}
 else if(a==='mode'){view=target.dataset.view;closeModal();render();window.scrollTo(0,0);}
 else if(a==='market'){market=target.dataset.market;render();}
 else if(a==='newMission')newMission();
 else if(a==='missionDetail')missionDetail(id);
 else if(a==='creatorDetail')creatorDetail(id);
 else if(a==='approveCreator')act('creator.approve',{id});
 else if(a==='verifyMetrics'){if(confirm(t('manualOnly')+'\n\n'+t('verifyMetrics')+'?'))act('creator.verify',{id,confirmed:true});}
 else if(a==='offer')offerMission(id);
 else if(a==='work')workModal(id);
 else if(a==='apply'){view='apply';closeModal();render();window.scrollTo(0,0);}
 else if(a==='buildBrief'){const f=$('#mission-form'),l=f.elements.market.value==='US'?'en':'he';f.elements.brief.value=TRANSLATIONS[l].briefDefault;toast(t('briefGenerated'));}
 else if(a==='scroll-work')$('#my-work')?.scrollIntoView({behavior:'smooth',block:'start'});
 else if(a==='cancelWork'){if(confirm(t('cancelConfirm'))){const reason=prompt(t('cancelReason'),'Demo cancellation');if(reason)act('assignment.cancel',{id,reason});}}
 else if(a==='decline'){if(confirm(t('declineConfirm')))act('assignment.decline',{id});}
 else if(a==='export'){download('simpliigood-creator-club-backup-'+C.today()+'.json',safeJSON(state),'application/json');toast(t('exported'));}
 else if(a==='exportCsv')exportCsv();
 else if(a==='import')$('#import-file')?.click();
 else if(a==='reset'){if(confirm(t('resetConfirm'))){persist(C.createSeed());market='all';creatorId='c3';render();toast(t('saved'));}}
});
document.addEventListener('input',event=>{if(event.target.id==='creator-search'){search=event.target.value;$('#creator-table').innerHTML=creatorsTable();}if(event.target.closest('#offer-form')&&['production','distribution','rights'].includes(event.target.name))updateTotal();});
document.addEventListener('change',async event=>{
 if(event.target.id==='creator-picker'){creatorId=event.target.value;render();}
 if(event.target.closest('#offer-form')&&event.target.name==='creatorId')updateQuote();
 if(event.target.id==='import-file'){
  const file=event.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error();const next=JSON.parse(await file.text());C.validateState(next);if(confirm(t('importConfirm'))){persist(next);render();toast(t('imported'));}}catch(_){toast(t('invalidBackup'),true);}finally{event.target.value='';}
 }
});
document.addEventListener('submit',event=>{
 const f=event.target;if(!(f instanceof HTMLFormElement))return;event.preventDefault();const p=data(f),id=f.dataset.id;
 if(f.id==='mission-form')act('mission.create',p);
 else if(f.id==='offer-form')act('assignment.offer',{...p,missionId:f.dataset.mission});
 else if(f.id==='accept-form')act('assignment.accept',{id,confirmed:f.elements.confirmed.checked});
 else if(f.id==='content-form')act('assignment.submit',{id,...p});
 else if(f.id==='publication-form')act('assignment.publish',{id,url:p.url});
 else if(f.id==='review-form')act('assignment.review',{id,decision:event.submitter?.value,feedback:p.feedback,checks:[0,1,2,3].map(i=>f.elements['check'+i].checked)});
 else if(f.id==='verify-form')act('assignment.verify',{id,confirmed:f.elements.confirmed.checked});
 else if(f.id==='payment-form')act('assignment.record',{id,reference:p.reference,confirmed:f.elements.confirmed.checked});
 else if(f.id==='rates-form'){const rates={};['IL','US'].forEach(m=>{rates[m]={production:{},distribution:[0,1,2,3,4].map(i=>p[m+'-d-'+i])};['reel','story','blog'].forEach(k=>rates[m].production[k]=p[m+'-p-'+k]);});act('settings.rates',{rates});}
 else if(f.id==='apply-form'){
  try{const next=C.dispatch(state,'creator.apply',{...p,consent:f.elements.consent.checked},{role:'public'});persist(next);view='admin';page='creators';market='all';render();toast(t('applicationSaved'));}catch(err){$('#application-errors').textContent=t(err.message);$('#application-errors').classList.remove('hide');}
 }
});
document.addEventListener('keydown',event=>{
 const modal=$('#modal-root .modal');if(!modal)return;if(event.key==='Escape'){closeModal();return;}
 if(event.key==='Tab'){const els=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(x=>x.offsetParent!==null),first=els[0],last=els.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
});
window.addEventListener('storage',event=>{if(event.key!==KEY||!event.newValue)return;try{const next=JSON.parse(event.newValue);C.validateState(next);state=next;closeModal();render();toast(t('stale'));}catch(_){toast(t('invalidBackup'),true);}});
window.ClubDemo={getState:()=>JSON.parse(JSON.stringify(state)),core:C};
render();if(loadError)toast(t(loadError),true);
})();
</script>
</body>
</html>
