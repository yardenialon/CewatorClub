name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: index.html matches the sources
        run: python build.py --check
      - name: Business-rule tests
        run: node test_core.js
      - name: Formatting helper tests
        run: node test_format.js
      - name: Install Playwright (tests only)
        run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python test_ui.py
