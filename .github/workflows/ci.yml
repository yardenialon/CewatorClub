name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle is up to date
        run: npm run build:check
      - name: Business-rule tests
        run: npm test
      - name: Install Playwright (Chromium)
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:ui
